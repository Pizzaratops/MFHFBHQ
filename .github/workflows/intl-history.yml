name: Intl-Historie (EuroLeague/EuroCup für Prospect-Modell)

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Saisons (Startjahr), z. B. 2005-2026'
        default: '2005-2026'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sports/nba/scripts/sync-intl-history.js "${{ github.event.inputs.years }}"
      - name: Commit
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/cbb/scripts/model/cache/intl
          git commit -m "chore: Intl-Historie ${{ github.event.inputs.years }}" || exit 0
          for i in 1 2 3; do git push && exit 0; git fetch origin "${GITHUB_REF_NAME}"; git rebase "origin/${GITHUB_REF_NAME}"; done
          exit 1
