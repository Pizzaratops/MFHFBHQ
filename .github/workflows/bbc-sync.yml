name: BBC Sync (Banana Boat Crew)

# Banana Boat Crew (ESPN 1761634032, Points, Redraft) -- liga-eigene Kette nach
# leagues/bbc/data/. Wird von nba-sync.yml nach der sportweiten Pipeline
# aufgerufen (halbstündlich 06-22 Uhr Berlin, parallel zu TTHQ/Funkytown) und
# ist zusätzlich manuell startbar. Liga privat → Secrets ESPN_S2 + SWID (wie BWP).
#
#   1. sync-espn.js   -> teams, rosters-live, league-info, nba-schedule, draft-results, transactions
#   2. build-points.js -> points.js (Fantasy-Punkte mit Liga-Scoring, braucht 1 + sportweite CSVs/Projections)

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bbc-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESPN (Kader, Matchups, Spielplan, Draft, Transaktionen)
        id: espn
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node leagues/bbc/scripts/sync-espn.js

      - name: Wochen-Stats je Team (Royal Rumble)
        id: weekstats
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node sports/nba/scripts/sync-week-stats.js --league=bbc --espn=1761634032 --season=2027

      - name: Fantasy-Punkte je Spieler
        id: points
        continue-on-error: true
        run: node leagues/bbc/scripts/build-points.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leagues/bbc/data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: bbc sync"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 8 + 3))
          done
          exit 1

      - name: Fehlgeschlagene Schritte melden
        if: steps.espn.outcome == 'failure' || steps.points.outcome == 'failure' || steps.weekstats.outcome == 'failure'
        run: |
          echo "Mindestens ein Schritt ist fehlgeschlagen (siehe oben)."
          exit 1
