name: DOPE Sync (Sleeper)

# Dynasty of Pretend Experts (Sleeper 1312799736218017792) -- ALLES
# Liga-Spezifische aus der öffentlichen Sleeper-API (Teams, Kader, Scores,
# Spielplan, Rookie Draft, Trades, Picks, Stats, Projektionen, Settings,
# Positions-Punkte) nach leagues/dope/data/, danach Fantasy Power Score.
# Scripts unverändert aus Dynasty-Of-Pretend-Experts. Keine Secrets nötig.
# Alle 2 Stunden (Minute 15) + manuell startbar.

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dope-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: leagues/dope
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache-Key (täglich)
        id: cachekey
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Sleeper players/nfl cachen (~5 MB, 1x/Tag)
        uses: actions/cache@v4
        with:
          path: /tmp/sleeper-players-slim.json
          key: sleeper-players-slim-${{ steps.cachekey.outputs.date }}

      - name: Sleeper Sync
        env:
          SLEEPER_PLAYERS_CACHE_PATH: /tmp/sleeper-players-slim.json
        run: node scripts/sync-sleeper.js

      - name: Fantasy Power Score
        run: node scripts/sync-fantasy-position-score.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: dope sleeper sync"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
