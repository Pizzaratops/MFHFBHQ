name: CBB Sync (Dizzle CBB Dynasty)

# College Basketball (Fantrax-Liga z8gwfku2mpmwh0xe), seit 16.10.2026.
#  1. Fantrax (jeder Lauf, stündlich): Teams, Kader, Spielplan, Standings,
#     Spielerpool → leagues/cbb/data/ (sync-fantrax.js)
#  2. Stats (4× täglich: 07/10/14/22 Uhr Berlin, oder manuell mit stats=true):
#     ESPN-Boxscores mens-college-basketball, nur Fantrax-Pool-Schulen
#     → sports/cbb/scripts/data (CSV) → Live Scores, Week/Month/Season,
#     Rolling-Archiv, Waiver-Board. Dieselben Scripts wie NBA (sports/nba/scripts)
#     mit --dir/--out auf sports/cbb. Danach Live-Projections (Projektion + echte Spiele).
#  3. Wöchentlich (Montag 07 Uhr oder rosters=true): ESPN-Kader, Coaches, Spielplan →
#     Modell (sports/cbb/scripts/model/build-projections.py): Projections, Team-Kontext, Dynasty.
# Keine Secrets nötig (Fantrax + ESPN öffentlich).

on:
  schedule:
    - cron: "47 * * * *"     # Fantrax stündlich
    # Stats 07/10/14/22 Uhr Berlin, je Uhrzeit Sommer- und Winter-Variante (Gate rechnet die
    # GEPLANTE Berlin-Stunde aus dem Cron — GitHub startet Crons oft Stunden zu spät)
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 8 * * *"
    - cron: "17 9 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      stats:
        description: "Stats-Pipeline auch außerhalb der festen Uhrzeiten laufen lassen"
        type: boolean
        default: false
      date:
        description: "Spieltag (YYYY-MM-DD) für die Stats, leer = gestern + heute (US-Ostküste)"
        required: false
        default: ""
      rosters:
        description: "ESPN-Kader der Pool-Schulen neu holen (sonst montags 07 Uhr)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cbb-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fantrax (Teams, Kader, Spielplan, Standings)
        id: fantrax
        continue-on-error: true
        run: node leagues/cbb/scripts/sync-fantrax.js

      - name: Stats-Lauf jetzt?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          IN_STATS: ${{ github.event.inputs.stats }}
          IN_ROSTERS: ${{ github.event.inputs.rosters }}
          SCHED: ${{ github.event.schedule }}
        run: |
          H=xx; DOW=$(TZ=Europe/Berlin date +%u)
          if [ "$EVENT" = "schedule" ] && [ "$SCHED" != "47 * * * *" ]; then
            CRON_H=$(echo "$SCHED" | awk '{print $2}'); OFF=$(TZ=Europe/Berlin date +%z | cut -c2-3)
            H=$(printf '%02d' $(( (10#$CRON_H + 10#$OFF) % 24 )))
            echo "Geplant ${H}:17 Berlin (Cron '${SCHED}'), gestartet $(TZ=Europe/Berlin date +%H:%M)."
          fi
          if [ "$IN_ROSTERS" = "true" ] || { [ "$DOW" = "1" ] && [ "$H" = "07" ]; }; then echo "rosters=true" >> "$GITHUB_OUTPUT"; else echo "rosters=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_STATS" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$H" = "07" ] || [ "$H" = "10" ] || [ "$H" = "14" ] || [ "$H" = "22" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: ESPN-Kader (Klasse, Größe, Position)
        id: espnrosters
        if: steps.gate.outputs.rosters == 'true'
        continue-on-error: true
        run: node sports/cbb/scripts/sync-espn-rosters.js

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.rosters == 'true'
        with:
          python-version: '3.12'

      - name: Projections 2026/27 + Team-Kontext + Dynasty (Modell, wöchentlich)
        id: model
        if: steps.gate.outputs.rosters == 'true'
        continue-on-error: true
        env:
          CBB_WORK: sports/cbb/scripts/model/cache
        run: |
          pip install -q pandas pyarrow numpy
          python3 sports/cbb/scripts/model/build-projections.py || { echo "::error title=CBB-Modell::build-projections.py fehlgeschlagen"; exit 1; }
          node sports/cbb/scripts/build-live-projections.js

      - name: Tagesdaten von ESPN (daily-9cat, College)
        id: daily
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node sports/cbb/scripts/daily-9cat.js ${{ github.event.inputs.date }}

      - name: Live Scores, Box Scores, Week/Month/Season, Rolling
        id: stats
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          S=sports/nba/scripts; D=sports/cbb/scripts/data; O=sports/cbb/data
          DATE="${{ github.event.inputs.date }}"
          DA=""; [ -n "$DATE" ] && DA="--date=$DATE"
          node $S/convert-to-livescores.js --dir=$D --out=$O/livescores-daily.js --keep-days=21 $DA
          node $S/convert-to-boxscores.js --dir=$D --out=$O/livescores-boxscores.js --keep-days=7 $DA
          node $S/prune-raw-data.js --dir=$D --keep-days=400 --keep-days-games=21
          node $S/update-all-aggregates.js --dir=$D --out=$O/livescores-aggregate.js --recent-days=4 --min-mpg=10 --week-history=false
          node $S/build-rolling-archive.js --league=ncaab --agg=$O/livescores-aggregate.js --season=$O/livescores-season.js --out=$O/rolling-rankings-2026-27.js
          node sports/cbb/scripts/build-live-projections.js

      - name: Waiver-Board
        id: board
        continue-on-error: true
        run: node leagues/cbb/scripts/build-best-available-board.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A leagues/cbb/data sports/cbb
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: cbb sync"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1

      - name: Fehlgeschlagene Schritte melden
        if: steps.espnrosters.outcome == 'failure' || steps.fantrax.outcome == 'failure' || steps.daily.outcome == 'failure' || steps.stats.outcome == 'failure' || steps.board.outcome == 'failure' || steps.model.outcome == 'failure'
        run: |
          echo "Mindestens ein Schritt ist fehlgeschlagen (siehe oben)."
          exit 1
