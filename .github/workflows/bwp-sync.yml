name: BWP Sync (Scores, Power Score, Projections, Stats)

# Bear Witch Project (ESPN 91260355) -- in EINEM Lauf, in der richtigen
# Reihenfolge (vorher vier Workflows mit Zeitversatz):
#   1. sync-espn-weekly-scores.js     -> weekly-scores.js + schedule.js
#   2. sync-fantasy-position-score.js -> fantasy-power-score.js (braucht 1)
#   3. sync-espn-projections.js       -> projections.js
#   4. sync-espn-player-stats.js      -> player-stats.js (braucht 1)
# W1/W2 bleiben eingefroren (data/frozen-weeks-2026.js, ESPN-Reset 23.09.).
# 09:00 und 21:00 Berlin (je Sommer-/Winterzeit-Cron) + manuell startbar.
# Secrets: ESPN_S2, SWID.

on:
  schedule:
    - cron: "0 7 * * *"    # 09:00 Berlin (Sommerzeit)
    - cron: "0 8 * * *"    # 09:00 Berlin (Winterzeit)
    - cron: "0 19 * * *"   # 21:00 Berlin (Sommerzeit)
    - cron: "0 20 * * *"   # 21:00 Berlin (Winterzeit)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bwp-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: leagues/bwp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Weekly Scores + Spielplan
        id: scores
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-espn-weekly-scores.js

      - name: Fantasy Power Score
        id: fps
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-fantasy-position-score.js

      - name: Projections
        id: proj
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-espn-projections.js

      - name: Player Stats
        id: stats
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-espn-player-stats.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weekly-scores.js data/schedule.js data/fantasy-power-score.js data/projections.js data/player-stats.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: bwp sync"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1

      - name: Fehlgeschlagene Schritte melden
        if: steps.scores.outcome == 'failure' || steps.fps.outcome == 'failure' || steps.proj.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "Mindestens ein Schritt ist fehlgeschlagen (siehe oben). Die übrigen Daten wurden trotzdem gespeichert."
          exit 1
