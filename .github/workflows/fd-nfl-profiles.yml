name: First Down NFL-Profile

# Teamprofile (Tendenzen, EPA, Blitz-/Box-Rate) und Spiele der Woche für
# First Down → first-down/data/nfl-week.js. Quellen: nflverse play-by-play,
# schedules, FTN Data via nflverse (CC-BY-SA 4.0).
# Di früh (Woche komplett), Fr (nach TNF), Mo (nach Sonntag); manuell startbar.

on:
  schedule:
    - cron: "15 8 * * 2"
    - cron: "15 8 * * 5"
    - cron: "15 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Profile berechnen
        run: node --max-old-space-size=4096 sports/nfl/scripts/build-fd-profiles.js
      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add first-down/data
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "chore: First Down NFL-Profile"
          for i in 1 2 3 4 5 6 7 8; do git push && exit 0; sleep $((i*5)); git fetch origin "${GITHUB_REF_NAME}"; git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort; done
          exit 1
