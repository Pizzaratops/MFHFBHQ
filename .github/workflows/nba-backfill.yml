name: NBA Backfill Live Scores (manuell)

# Holt vergangene Spieltage nach (z.B. Summer League) -- sportweit nach
# sports/nba/ (vorher je eine Kopie in Taco-Tuesday-HQ und
# Citizens-of-Funkytown). Danach Weekly/Monthly neu. Keine Secrets nötig.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all-summer-2026 (California + SLC + Vegas laut Zeitplan) oder custom'
        required: true
        default: 'all-summer-2026'
        type: choice
        options:
          - all-summer-2026
          - custom
      league:
        description: 'Nur bei mode=custom: ESPN League-Slug (z.B. nba-summer-california)'
        required: false
      from:
        description: 'Nur bei mode=custom: Startdatum YYYY-MM-DD'
        required: false
      to:
        description: 'Nur bei mode=custom: Enddatum YYYY-MM-DD (leer = nur "from")'
        required: false

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sports/nba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backfill ausführen
        env:
          MODE: ${{ github.event.inputs.mode }}
          LEAGUE: ${{ github.event.inputs.league }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
          if [ "$MODE" = "all-summer-2026" ]; then
            node scripts/backfill-9cat.js --all-summer-2026
          else
            node scripts/backfill-9cat.js --league="$LEAGUE" --from="$FROM" --to="$TO"
          fi

      - name: Weekly/Monthly aktualisieren (alle Standorte kombiniert)
        run: node scripts/update-all-aggregates.js --keep=180

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ scripts/data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: nba backfill"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
