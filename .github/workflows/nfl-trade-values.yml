name: NFL Trade Values (KTC + Dynasty Daddy)

# Wöchentlicher Sync der Trade-Werte für den Trade Analyzer / die Trade
# History beider Football-Ligen (BWP, DOPE) nach sports/nfl/data/trade-values.js.
# Quellen: KeepTradeCut (1QB) + Dynasty Daddy (API, market 3) — keine Secrets.
# Dienstag früh nach Monday Night Football + manuell startbar.

on:
  schedule:
    - cron: "15 6 * * 2"   # Dienstag 07:15/08:15 Berlin
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trade-Werte holen
        id: tv
        continue-on-error: true
        run: node sports/nfl/scripts/sync-trade-values.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports/nfl/data/trade-values.js
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "chore: NFL Trade Values (KTC + Dynasty Daddy)"
          for i in 1 2 3; do git push && exit 0; git fetch origin "${GITHUB_REF_NAME}"; git rebase "origin/${GITHUB_REF_NAME}"; done
          exit 1

      - name: Status
        if: steps.tv.outcome == 'failure'
        run: |
          echo "::error::Trade-Werte-Sync fehlgeschlagen oder eine Quelle fehlte — Log oben prüfen."
          exit 1
