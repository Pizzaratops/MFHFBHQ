name: Funkytown Saison-Standings (manuell)

# Citizens of Funkytown (ESPN 15679): Saison-Historie (Endstände, Champions)
# von ESPN nach leagues/funkytown/data/season-history.js. Nur manuell, z.B.
# nach Saisonende. Script unverändert aus Citizens-of-Funkytown
# (fetch-espn-standings.yml). Keine Secrets nötig.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Einzelne ESPN-Saison (z.B. 2022 für Saison 2021/22). Leer lassen für Bereich/Standard."
        required: false
        default: ""
      from:
        description: "Bereich: erste ESPN-Saison (nur zusammen mit 'to' nutzen)"
        required: false
        default: ""
      to:
        description: "Bereich: letzte ESPN-Saison (nur zusammen mit 'from' nutzen)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: funkytown-data
      cancel-in-progress: false
    defaults:
      run:
        working-directory: leagues/funkytown
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Standings abrufen
        env:
          SEASON: ${{ github.event.inputs.season }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
          if [ -n "$SEASON" ]; then
            node scripts/fetch-espn-standings.js --season "$SEASON"
          elif [ -n "$FROM" ] && [ -n "$TO" ]; then
            node scripts/fetch-espn-standings.js --from "$FROM" --to "$TO"
          else
            node scripts/fetch-espn-standings.js
          fi

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/season-history.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: funkytown saison-standings"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
