name: NFL 32 (All-Play-Liga)

# Alle 32 NFL-Teams als Fantasy-Teams: beste Aufstellung je Woche mit
# DOPE-Scoring aus nflverse-Stats → leagues/nfl32/data/.
# Dienstag früh nach Monday Night Football, zusätzlich Freitag (TNF) und
# Montag (Sonntagsspiele) für Zwischenstände; manuell startbar.

on:
  schedule:
    - cron: "45 7 * * 2"   # Di — Woche komplett
    - cron: "45 7 * * 1"   # Mo — Sonntagsspiele
    - cron: "45 7 * * 5"   # Fr — Thursday Night
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # aktuellen Branch-Stand holen (nicht den Commit vom Auslösezeitpunkt) – sonst
          # arbeitet ein wartender Lauf auf altem Stand und der Push endet im Rebase-Konflikt
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: NFL 32 berechnen
        run: node leagues/nfl32/scripts/sync-nfl32.js
      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leagues/nfl32/data
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit -m "chore: NFL 32 sync"
          for i in 1 2 3 4 5 6 7 8; do git push && exit 0; sleep $((i*5)); git fetch origin "${GITHUB_REF_NAME}"; git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort; done
          exit 1
