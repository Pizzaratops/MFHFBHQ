name: Funkytown Sync (Citizens of Funkytown)

# Citizens of Funkytown (ESPN 15679, Redraft) -- liga-eigene Kette nach
# leagues/funkytown/data/. Wird von nba-sync.yml nach der sportweiten
# Pipeline aufgerufen (halbstündlich 06-22 Uhr Berlin, parallel zu TTHQ) und
# ist zusätzlich manuell startbar. Scripts unverändert aus
# Citizens-of-Funkytown, nur sportweite Eingaben (aliases, Roh-CSVs,
# Aggregate, Off-Season, Rolling) kommen jetzt aus sports/nba/.
#
#   1. sync-espn-rosters.js          -> rosters-live.js
#   2. sync-espn-matchups.js         -> season-matchups.js (Tabellenverlauf)
#   3. build-live-projections.js     -> live-projections.js (Baseline/Consensus + Saison-CSVs;
#      Baseline/Consensus seit 08.10.2026 = TTHQ, s. adopt-tthq-projections.js)
#   4. build-team-analytics.js       -> team-analytics.js (braucht 1 + 3)
#   5. build-best-available-board.js -> best-available-board.js (braucht 3)
#
# Keine Secrets nötig (ESPN öffentlich). Saison-Historie: funkytown-standings.yml.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: funkytown-data
      cancel-in-progress: false
    defaults:
      run:
        working-directory: leagues/funkytown
    steps:
      # Branch-Spitze statt Trigger-Commit: beim Aufruf aus nba-sync.yml
      # enthält sie bereits den frischen Sport-Commit desselben Laufs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Merge-Konflikt-Marker Check
        working-directory: .
        run: |
          if grep -rlnE '^(<{7} |={7}$|>{7} )' --include='*.js' leagues/funkytown sports/nba/data; then
            echo "::error::Unaufgelöster Git-Merge-Konflikt in den oben gelisteten Dateien -- bitte manuell auflösen und neu pushen."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESPN Kader
        id: rosters
        continue-on-error: true
        run: node scripts/sync-espn-rosters.js

      - name: ESPN Wochen-Matchups
        id: matchups
        continue-on-error: true
        run: node scripts/sync-espn-matchups.js

      # Seit 08.10.2026: Funkytown nutzt dieselben Projections wie TTHQ
      # (Beyaz' Baseline + Consensus), ergänzt um Funkytown-Veteranen, die
      # TTHQ nicht projiziert (data/projections-*-own.js).
      - name: Projections von TTHQ übernehmen
        id: adoptproj
        continue-on-error: true
        run: node scripts/adopt-tthq-projections.js

      - name: Live Projections
        id: liveproj
        continue-on-error: true
        run: node scripts/build-live-projections.js --league=nba

      - name: Team Analytics
        id: analytics
        continue-on-error: true
        run: node scripts/build-team-analytics.js

      - name: Best Available Board
        id: bestavail
        continue-on-error: true
        run: node scripts/build-best-available-board.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: funkytown sync"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1

      - name: Fehlgeschlagene Schritte melden
        if: steps.adoptproj.outcome == 'failure' || steps.rosters.outcome == 'failure' || steps.matchups.outcome == 'failure' || steps.liveproj.outcome == 'failure' || steps.analytics.outcome == 'failure' || steps.bestavail.outcome == 'failure'
        run: |
          echo "Mindestens ein Schritt ist fehlgeschlagen (siehe oben). Die übrigen Daten wurden trotzdem gespeichert."
          exit 1
