name: NBA Preseason Score

# Preseason Score (Skill-Profil aus Preseason + Vorsaison) für beide NBA-Ligen.
# Sportweit, läuft EINMAL: sports/nba/scripts/update-preseason-score.js holt
# neue Preseason-Boxscores von ESPN (seasontype=1), cacht sie unter
# sports/nba/data/preseason/<Saison>/games/ und schreibt
# sports/nba/data/preseason-score.js (PRESEASON_SCORE). Seite: #/<liga>/preseason.
#
# Außerhalb des Fensters (25.09. + 40 Tage) beendet sich das Script sofort,
# der Workflow kann das ganze Jahr aktiv bleiben. Keine Secrets (ESPN öffentlich).
# 10:00 UTC = 12:00 MESZ, nach den späten US-Spielen.
# Eigene concurrency-Gruppe: committet nur seine eigenen Dateien, der Rebase
# gegen NBA-/NFL-Syncs ist damit konfliktfrei.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Auch außerhalb des Preseason-Fensters rechnen (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: nba-preseason
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sports/nba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preseason-Boxscores laden und Score berechnen
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          # PRESEASON_START: "2026-09-28"   # optional; Standard 25. September
        run: node scripts/update-preseason-score.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/preseason-score.js data/preseason/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: nba preseason score"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- hole aktuellen Stand und versuche erneut..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
