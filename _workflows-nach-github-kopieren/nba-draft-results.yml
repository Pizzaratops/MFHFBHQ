name: NBA Draft Results abrufen (manuell)

# Holt die Ergebnisse eines abgeschlossenen ESPN-Liga-Drafts nach
# leagues/<liga>/data/draft-results-<saison>.js + draft-results-active.js.
# Ersetzt die zwei gleichnamigen Workflows aus Taco-Tuesday-HQ und
# Citizens-of-Funkytown (Scripts unverändert, Liga per Auswahl).
# Keine Secrets nötig.

on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Liga"
        required: true
        type: choice
        options:
          - tthq
          - funkytown
      season:
        description: "ESPN-Saison des abgeschlossenen Drafts (z.B. 2026). Leer lassen für Standard."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.event.inputs.liga }}-data
      cancel-in-progress: false
    defaults:
      run:
        working-directory: leagues/${{ github.event.inputs.liga }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draft Results abrufen
        env:
          SEASON: ${{ github.event.inputs.season }}
        run: |
          if [ -n "$SEASON" ]; then
            node scripts/fetch-draft-results-espn.js --season "$SEASON"
          else
            node scripts/fetch-draft-results-espn.js
          fi

      - name: Commit & Push falls geändert
        env:
          LIGA: ${{ github.event.inputs.liga }}
        run: |
          git config user.name "mfhfb-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/draft-results-*.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: ${LIGA} draft results"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
